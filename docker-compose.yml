      test: ["CMD", "curl", "-f", "http://localhost:9093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  seguimientos-service:
    build: ./seguimientos-services
    container_name: gym-seguimientos
    ports:
      - "9094:9094"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USUARIOS_SERVICE_URL=http://usuarios-service:9091
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pagos-service:
