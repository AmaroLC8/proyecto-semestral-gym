      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: gym-gateway
    ports:
      - "9090:9090"
    depends_on:
      auth-service:
        condition: service_started
      usuarios-service:
        condition: service_started
      rutinas-service:
        condition: service_started
      reservas-service:
        condition: service_started
      seguimientos-service:
        condition: service_started
      pagos-service:
        condition: service_started
      inventario-service:
        condition: service_started
      recomendaciones-service:
        condition: service_started
      soporte-service:
        condition: service_started
      reviews-service:
        condition: service_started
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

networks:
  gym-network:
    driver: bridge

volumes:
  db-data: