      - "9095:9095"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - USUARIOS_SERVICE_URL=http://usuarios-service:9091
      - RESERVAS_SERVICE_URL=http://reservas-service:9093
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
