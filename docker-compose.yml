services:
  mysql:
    image: mysql:8.0
    container_name: gym-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  usuarios-service:
    build: ./usuarios-services
    container_name: gym-usuarios
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rutinas-service:
    build: ./rutinas-services
    container_name: gym-rutinas
    ports:
      - "9092:9092"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reservas-service:
    build: ./reservas-services
    container_name: gym-reservas
    ports:
      - "9093:9093"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - gym-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
