# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
# Puerto en el que corre este microservicio
server.port=8080
spring.application.name=api-gateway

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MYSQL EN DOCKER)
# ===================================================================
# Usamos 'mysql' como host porque Docker resuelve el nombre del servicio en la red interna
spring.datasource.url=jdbc:mysql://mysql:3306/gym?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# 'update' creará las tablas automáticamente en la base de datos 'gym' si no existen
spring.jpa.hibernate.ddl-auto=update
# Cambiar a 'true' si necesitas ver las consultas SQL en la consola del contenedor
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CONFIGURACIÓN DE SWAGGER / SPRINGDOC (ACCESO DESDE EL GATEWAY)
# ===================================================================
# Define la ruta del JSON de documentación que el API Gateway va a consumir
springdoc.api-docs.path=/v3/api-docs
# Habilita la generación de docs en este microservicio
springdoc.api-docs.enabled=true
