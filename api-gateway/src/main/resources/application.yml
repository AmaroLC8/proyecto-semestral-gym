server:
  port: 9090

spring:
  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: esta_es_mi_compleja_clave_secreta

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/auth/**

        - id: usuarios-service
          uri: http://localhost:9091
          predicates:
            - Path=/usuarios/**

        - id: pagos-service
          uri: http://localhost:9095
          predicates:
            - Path=/pagos/**
          
        - id: reservas-service
          uri: http://localhost:9093
          predicates:
            - Path=/reservas/**
          
        - id: rutinas-service
          uri: http://localhost:9092
          predicates:
            - Path=/rutinas/**
          
        - id: seguimientos-service
          uri: http://localhost:9094
          predicates:
            - Path=/seguimientos/**
        
        - id: seguimientos-service
          uri: http://localhost:9094
          predicates:
            - Path=/seguimientos/**

        - id: inventario-service
          uri: http://localhost:9096
          predicates:
            - Path=/inventario/**

        - id: recomendaciones-service
          uri: http://localhost:9097
          predicates:
            - Path=/recomendaciones/**

        - id: soporte-service
          uri: http://localhost:9098
          predicates:
            - Path=/soporte/**

        - id: review-service
          uri: http://localhost:9099
          predicates:
            - Path=/review/**


