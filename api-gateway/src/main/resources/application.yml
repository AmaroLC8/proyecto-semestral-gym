server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Servicios iniciales
        - id: usuarios-route
          uri: http://usuarios-service:9091
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=1
            
        - id: rutinas-route
          uri: http://rutinas-service:9092
          predicates:
            - Path=/api/rutinas/**
          filters:
            - StripPrefix=1
            
        - id: reservas-route
          uri: http://reservas-service:9093
          predicates:
            - Path=/api/reservas/**
          filters:
            - StripPrefix=1
            
        - id: seguimientos-route
          uri: http://seguimientos-service:9094
          predicates:
            - Path=/api/seguimientos/**
          filters:
            - StripPrefix=1
            
        - id: pagos-route
          uri: http://pagos-service:9095
          predicates:
            - Path=/api/pagos/**
          filters:
            - StripPrefix=1
            
        - id: inventario-route
          uri: http://inventario-service:9096
          predicates:
            - Path=/api/inventario/**
          filters:
            - StripPrefix=1
            
        # Servicios finales
        - id: recomendaciones-route
          uri: http://recomendaciones-service:9097
          predicates:
            - Path=/api/recomendaciones/**
          filters:
            - StripPrefix=1
            
        - id: soporte-route
          uri: http://soporte-service:9098
          predicates:
            - Path=/api/soporte/**
          filters:
            - StripPrefix=1
            
        - id: reviews-route
          uri: http://reviews-service:9099
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=1
            
        - id: auth-route
          uri: http://auth-service:8085
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

# ¡ESTA ES LA MAGIA DEL DESPLEGABLE!
springdoc:
  swagger-ui:
    path: /doc/swagger-ui.html
    urls:
      - name: Autenticación
        url: /api/auth/v3/api-docs
      - name: Usuarios
        url: /api/usuarios/v3/api-docs
      - name: Rutinas
        url: /api/rutinas/v3/api-docs
      - name: Reservas
        url: /api/reservas/v3/api-docs
      - name: Seguimientos
        url: /api/seguimientos/v3/api-docs
      - name: Pagos
        url: /api/pagos/v3/api-docs
      - name: Inventario
        url: /api/inventario/v3/api-docs
      - name: Recomendaciones
        url: /api/recomendaciones/v3/api-docs
      - name: Soporte
        url: /api/soporte/v3/api-docs
      - name: Reviews
        url: /api/reviews/v3/api-docs

  api-docs:
    server:
      url: http://localhost:9090

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway: DEBUG