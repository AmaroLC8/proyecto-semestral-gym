server:
  port: 9090

spring:
  main:
      web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: usuarios-service
            uri: http://localhost:9091
            predicates:
            - Path=/usuarios/**

          - id: pagos-service
            uri: http://localhost:9095
            predicates:
            - Path=/pagos/**
          
          - id: reservas-service
            uri: http://localhost:9093
            predicates:
            - Path=/reservas/**
          
          - id: rutinas-service
            uri: http://localhost:9092
            predicates:
            - Path=/rutinas/**
          
          - id: seguimientos-service
            uri: http://localhost:9094
            predicates:
            - Path=/seguimientos/**
