server:
  port: 9096

spring:
  application:
    name: inventario-services
  datasource:
    url: jdbc:mysql://localhost:3306/db_inventario?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: false
  flyway:
    enabled: false

jwt:
  secret-key: esta_es_mi_compleja_clave_secreta_de_32_caracteres_minimo

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: false
    register-with-eureka: false

springdoc:
  api-docs:
    enabled: true
    path: /inventario/v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    com.grupito: INFO
  file:
    name: logs/inventario-services.log
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
    file: "%d{HH:mm:ss} %-5level %msg%n"