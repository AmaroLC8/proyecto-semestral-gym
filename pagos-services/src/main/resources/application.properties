spring.application.name=pagos-services

server.port=9095

spring.datasource.url=jdbc:mysql://localhost:3306/db_pagos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OPCIONAL
spring.jpa.open-in-view=false

# URLs de otros microservicios
usuarios.service.url=http://localhost:9091
reservas.service.url=http://localhost:9093

# Logging
logging.level.com.grupito.pagos_services=INFO
logging.file.name=logs/pagos-services.log