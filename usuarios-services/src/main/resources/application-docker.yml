server:
  port: 9091

spring:
  application:
    name: usuarios-services
  datasource:
    url: jdbc:mysql://gym-mysql:3306/db_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog.sql

logging:
  level:
    com.grupito.usuarios_services: INFO
  file:
    name: logs/usuarios-services.log

springdoc:
  api-docs:
    path: /usuarios/v3/api-docs