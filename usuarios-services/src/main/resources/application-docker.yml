server:
  port: 9091

spring:
  application:
    name: usuarios-services
  datasource:
    url: jdbc:mysql://mysql:3306/db_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: false
  flyway:
    enabled: false

# CONFIGURACIÓN CLAVE PARA EL JWT
jwt:
  secret-key: esta_es_mi_compleja_clave_secreta_de_32_caracteres_minimo

springdoc:
  api-docs:
    enabled: true
    path: /usuarios/v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    com.grupito.usuarios_services: INFO
  file:
    name: logs/usuarios-services.log
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"
    file: "%d{HH:mm:ss} %-5level %msg%n"