spring.application.name=soporte-services
server.port=9098

spring.datasource.url=jdbc:mysql://localhost:3306/db_soporte?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OPCIONAL
spring.jpa.open-in-view=false
springdoc.api-docs.path=/soporte/v3/api-docs