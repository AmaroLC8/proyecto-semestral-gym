server:
  port: 8085
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
logging:
  level:
    com.grupito.auth_service: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"